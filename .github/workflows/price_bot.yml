name: Price Monitor Bot Sofia (2x Daily)

on:
  schedule:
    # Сутрин в 08:30 ч. българско време (06:30 UTC)
    - cron: "30 6 * * *"
    # Следобед в 16:30 ч. българско време (14:30 UTC)
    - cron: "30 14 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/price_bot.yml"
      - "price_bot/bot.py"
      - "price_bot/config.json"
      - "README.md"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Изпрати тестови имейл отчет дори да няма промяна в цената"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "price_bot/requirements.txt"

      - name: Install dependencies & Xvfb for Cloudflare Turnstile bypass
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install -r price_bot/requirements.txt

      - name: Run Price Bot (Sofia Physical & Transport-Defect Stores)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || ( [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_email }}" = "true" ] ); then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python price_bot/bot.py --force-email
          else
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python price_bot/bot.py
          fi

      - name: Save updated price state & history back to repo
        run: |
          git config user.name "price-bot[bot]"
          git config user.email "price-bot@users.noreply.github.com"
          git add price_bot/price_state.json price_bot/price_history.csv price_bot/latest_report.md
          git diff --staged --quiet || git commit -m "chore(prices): update Sofia price state & history [skip ci]"
          git push
